# GENERATED by packaging/linux/tinta-flatpak.sh from the release's bundle manifest.
# Do not edit: change the release's manifest or the script, then run
# `packaging/linux/tinta-flatpak.sh generate`. Build the bundle with
# `packaging/linux/tinta-flatpak.sh bundle`.
#
# Flatpak manifest for the single-file bundle attached to every GitHub release
# (tinta-presenta-<version>-linux-<arch>.flatpak). Build it with packaging/linux/tinta-flatpak.sh bundle.
#
# It repackages the release's own Linux tarball (tinta-presenta-<version>-linux-<arch>.tar.gz, built
# on Ubuntu 22.04 by package.sh with the craft-fonts embedded) instead of compiling Rust inside
# flatpak-builder: no network and no vendored crate sources during the build, a few seconds
# instead of 20+ minutes, and byte-for-byte the same binaries as the AppImage/deb/rpm. The script
# unpacks the tarball into `stage/` next to a copy of this file. The binaries need glibc >= 2.35
# and load X11, Wayland, xkbcommon, Vulkan and ALSA at runtime; the freedesktop runtime has all
# of them, and the GPU driver comes from its org.freedesktop.Platform.GL extension.
#
# A from-source manifest under the Tinta id (for Flathub) does not exist yet.
id: io.github.stdenis1980.tintapresenta
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: deckcraft
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Sound for audio and video in slide shows (cpal over ALSA, routed to PulseAudio/PipeWire by
  # the runtime's ALSA plugin).
  - --socket=pulseaudio
  # Open/Save dialogs go through the file-chooser portal (rfd) and drag-and-drop through the
  # document portal, so picked files work anywhere without broad filesystem access. Documents is
  # granted so decks passed by path (the command line, Open Recent) work in the usual place.
  - --filesystem=xdg-documents
  # Network: update checks reach GitHub. The optional --control server still listens on 127.0.0.1
  # only. Home/host filesystem access is deliberately not granted.
  - --share=network
modules:
  - name: deckcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/deckcraft /app/bin/deckcraft
      - install -Dm755 bin/deckcraft-cli /app/bin/deckcraft-cli
      - install -Dm644 share/applications/io.github.stdenis1980.tintapresenta.desktop /app/share/applications/io.github.stdenis1980.tintapresenta.desktop
      # .deckcraft; the runtime's shared-mime-info already knows the PowerPoint types.
      - install -Dm644 share/mime/packages/io.github.stdenis1980.tintapresenta.xml /app/share/mime/packages/io.github.stdenis1980.tintapresenta.xml
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/io.github.stdenis1980.tintapresenta.metainfo.xml /app/share/metainfo/io.github.stdenis1980.tintapresenta.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/deckcraft /app/share/doc/
    sources:
      - type: dir
        path: stage
