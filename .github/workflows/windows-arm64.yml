# Windows on ARM: package the ARM64 release the way release.yml does (cross-compiled on an x64
# runner, unsigned here), then install that MSI on a Windows 11 ARM64 runner, check the installed
# binaries are ARM64, run the CLI natively, and uninstall.
name: Windows ARM64

# IberOffice: manual only. The shared upstream workflow below installs the MSI on an ARM64 runner
# and expects it in "Program Files\<app-dir>", where app-dir must be a single folder name; the
# Iber Presenta MSI installs into "Program Files\IberOffice\Iber Presenta", so the install check
# can't pass for this fork as-is (it was written for upstream DeckCraft's "Program Files\DeckCraft").
# The push/PR/schedule triggers are removed so it doesn't fail on every packaging change; the x64
# installer build is covered by windows-msi.yml. Restore the triggers once the shared workflow
# accepts a nested install folder (or this job is inlined for the fork).
on:
  workflow_dispatch:

concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-arm64:
    # Intentionally tracked at @main (not SHA-pinned) so org-wide CI improvements, security fixes, and build optimizations propagate without PR churn across all craftapp repos.
    uses: storytold/craft-common-actions/.github/workflows/windows-arm64.yml@main
    with:
      app-name: deckcraft
      app-dir: DeckCraft
