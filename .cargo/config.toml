# Local development builds embed the craft-fonts checkout next to this repo when it exists
# (build.rs warns and continues without it). CI and releases set CRAFT_FONTS_DIR explicitly.
[env]
CRAFT_FONTS_DIR = { value = "../craft-fonts", relative = true }
# Tinta Office: this fork's builds are "Tinta Presenta" (see crates/brand). The ArtCraft
# marks may not be used by redistributed builds (docs/brand/LICENSE-brand.txt).
DECKCRAFT_BRAND_NAME = "Tinta Presenta"
DECKCRAFT_BRAND_SLUG = "tinta-presenta"
DECKCRAFT_BRAND_APP_ID = "io.github.stdenis1980.tintapresenta"
DECKCRAFT_BRAND_PUBLISHER = "Tinta Office"
DECKCRAFT_BRAND_WEBSITE = "https://github.com/StDenis1980/deckcraft"
DECKCRAFT_BRAND_GITHUB = "https://github.com/StDenis1980/deckcraft"
# Tinta Office error reports (apps/deckcraft/src/tinta_report.rs); unset, the app never asks or sends.
TINTA_REPORT_URL = "https://report.tintaoffice.com"

[alias]
xtask = "run --package xtask --"
